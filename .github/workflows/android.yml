name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build App
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            gradle/wrapper/gradle-wrapper.properties

      - name: Prepare release signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          : "${SIGNING_KEY:?Missing SIGNING_KEY secret}"
          : "${STORE_PASSWORD:?Missing KEY_STORE_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing ALIAS secret}"
          keystore_file="$RUNNER_TEMP/wbxposed-release.jks"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$keystore_file"
          chmod 600 "$keystore_file"
          {
            printf 'STORE_FILE=%s\n' "$keystore_file"
            printf 'STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build with Gradle
        shell: bash
        run: ./gradlew assembleRelease lintRelease --stacktrace --console=plain

      - name: Show APKs SHA256
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -gt 0
          {
            printf '### Build Success\n\n|Artifact|SHA256|\n|:--------:|:----------|\n'
            for apk in "${apks[@]}"; do
              checksum=$(sha256sum "$apk")
              printf '|%s|%s|\n' "$(basename "$apk")" "${checksum%% *}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/wbxposed-release.jks"
